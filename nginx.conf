server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the browser refuses to stream-compile the module without this exact type
    types {
        application/wasm wasm;
        text/html        html;
        text/javascript  js;
        image/png        png;
        model/gltf-binary glb;
        text/plain       ron;
    }

    # serves game_bg.wasm.gz when it exists, so the 148 MB go over the wire as ~21 MB
    gzip_static on;

    gzip on;
    gzip_types application/wasm text/javascript text/html model/gltf-binary text/plain;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        try_files $uri $uri/ =404;
    }

    # the bundle and its own serving config share one directory, so that the
    # repo is both the pages root and a runnable compose stack. the config is
    # not part of the site
    location ~ ^/(docker-compose\.yml|nginx\.conf|\.gitignore)$ {
        deny all;
    }

    # the wasm is rebuilt often and is huge, so it must never be cached stale
    location ~ \.(wasm|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
